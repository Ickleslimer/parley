[package]
name = "parley-lanes"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Parley lane-grant store and fail-closed Grok child hook"
license = "MIT"
publish = false

[lib]
name = "parley_lanes"
path = "src/lib.rs"

[[bin]]
name = "parley-lane-hook"
path = "src/bin/parley-lane-hook.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
