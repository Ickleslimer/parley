[package]
name = "parley-health"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Parley peer-health supervisor, read-only query, and Grok hook"
license = "MIT"
publish = false

[lib]
name = "parley_health"
path = "src/lib.rs"

[[bin]]
name = "parley-health-supervisor"
path = "src/bin/parley-health-supervisor.rs"

[[bin]]
name = "parley-health-query"
path = "src/bin/parley-health-query.rs"

[[bin]]
name = "parley-health-hook"
path = "src/bin/parley-health-hook.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Media",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
